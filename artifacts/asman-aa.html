<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asman — AA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%;
      background: #111;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .aa {
      position: relative;
      display: block;
      width: 1.28em;
      height: 0.9em;
      color: #fff;
      font-family: "Bodoni Moda", Georgia, serif;
      font-weight: 400;
      font-optical-sizing: auto;
      font-size: clamp(6rem, 28vw, 14rem);
      line-height: 1;
      font-synthesis: none;
    }
    .aa span {
      position: absolute;
      top: 0;
      left: 0;
    }
    .aa .a2 { left: 0.36em; }
  </style>
</head>
<body>
  <span class="aa" aria-label="AA">
    <span>A</span>
    <span class="a2">A</span>
  </span>
</body>
</html>
